# Board: Espressif ESP32 Dev Module
# Definition: definitions/boards/esp32dev/manifest.yaml
#
# Smart Input Module: supplementary remote annunciator input for an FDAS panel.
# Hardware and the initial ESP32 firmware by Jake, the project's hardware engineer;
# this config builds on his first ESPHome version.
#
# Reads the zone inputs, drives the FIRE/MON relays and the RGB LED locally, and
# publishes the zone state to AWS IoT Core following docs/mqtt-contract.md (v1).
# Local outputs never depend on the network: they keep working with no Wi-Fi or cloud.
#
# All credentials and keys live in secrets.yaml (the !secret lines), so this file
# is safe to copy into the public repo.

esphome:
  name: smart-input-module
  friendly_name: Smart Input Module

esp32:
  variant: esp32
  framework:
    # ESPHome builds on Espressif's own ESP-IDF instead of Arduino.
    # MQTT client-certificate TLS (needed for AWS IoT Core later) is only available here.
    type: esp-idf

# Logs go to the USB serial port (and to the dashboard over Wi-Fi).
# ESPHome logs binary-sensor changes only at VERBOSE, so each input below has an
# explicit on_state log line instead. That's how we verify the breadboard wiring:
# press each button and read the log.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # A bare "encryption:" reuses the API key above. Wi-Fi firmware uploads are then
    # both authenticated (nobody else on a shared workshop network can flash the
    # board) and encrypted (the image contains the Wi-Fi password).
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # New workshop, unknown Wi-Fi: after ~1 minute without a connection the board
  # starts this hotspot. Join it from a phone and pick the new network in the
  # captive portal page. No reflash needed.
  ap:
    ssid: Smart Input Mod Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

# Real-world clock for the "ts" field (contract D1: nothing is published until it's synced,
# because consumers judge staleness from ts, contract C1).
time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      - script.execute: publish_state

# ---------------------------------------------------------------------------
# AWS IoT Core (docs/mqtt-contract.md). TLS with a device certificate on port 8883.
# The private key was generated on the maker's Mac and only exists in secrets.yaml.
# ---------------------------------------------------------------------------
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  # Must equal the AWS IoT thing name: the device policy only allows connecting as
  # ${iot:Connection.Thing.ThingName}.
  client_id: fdas-iot-ane1-input-01
  certificate_authority: !secret aws_root_ca
  client_certificate: !secret mqtt_client_cert
  client_certificate_key: !secret mqtt_client_key
  # Contract D5: switch off everything ESPHome would publish/subscribe on its own.
  # AWS IoT disconnects a client that touches a topic outside its policy.
  discovery: false
  discover_ip: false
  topic_prefix: null
  log_topic: null
  keepalive: 30s
  # Publish from a separate task, so a slow or broken network can never stall the
  # main loop that drives the local FIRE/MON relays and LED.
  idf_send_async: true
  # Contract D3: retained online/offline on the status topic. The will is published by
  # AWS only on an UNEXPECTED disconnect, so a clean shutdown/reboot sends its own offline.
  birth_message:
    topic: fdas/fdas-iot-ane1-input-01/status
    payload: online
    qos: 1
    retain: true
  will_message:
    topic: fdas/fdas-iot-ane1-input-01/status
    payload: offline
    qos: 1
    retain: true
  shutdown_message:
    topic: fdas/fdas-iot-ane1-input-01/status
    payload: offline
    qos: 1
    retain: true
  on_connect:
    # Refresh the retained snapshot immediately after every (re)connect.
    - script.execute: publish_state

# ---------------------------------------------------------------------------
# Inputs
#
# Signal path per channel: dry contact -> PC817 optocoupler -> (74HC04 on the v4
# board) -> GPIO. Energized contact = GPIO HIGH = sensor ON.
#
# Why these settings:
# - use_interrupt: false. ESPHome defaults to hardware interrupts, but GPIO36/39
#   (Zone 1/2) can fire phantom edges while Wi-Fi is on (ESP32 errata). Polling
#   avoids that on every zone, so all channels behave identically.
# - No pull resistors on GPIO34-39: those pins have none in hardware, and the
#   board actively drives them.
# - delayed_on 50ms / delayed_off 1s: "quick to alarm, slow to clear". 50ms rides
#   out contact bounce without meaningfully delaying an alarm. The longer off-delay
#   stops a flickering alarm contact from reporting a string of brief "clears".
# - inverted: false = a CLOSED contact reads as ON. If the panel's zone relays are
#   wired normally-closed (the fail-safe choice), flip to true: then an alarm OR a
#   cut wire reads as ON, never as a silent "normal".
# - on_state + trigger_on_initial_state: log every change, AND the first reading
#   after boot, so a floating (unconnected) input shows up in the log right away.
#   Logging only: the relays and LED are driven by the level-triggered loop below.
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: zone_1
    name: "Zone 1"
    pin:
      number: GPIO36
      mode:
        input: true
      inverted: false
    use_interrupt: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          format: "Zone 1 (GPIO36) -> %s"
          args: ['x ? "ON" : "OFF"']
      - script.execute: publish_state

  - platform: gpio
    id: zone_2
    name: "Zone 2"
    pin:
      number: GPIO39
      mode:
        input: true
      inverted: false
    use_interrupt: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          format: "Zone 2 (GPIO39) -> %s"
          args: ['x ? "ON" : "OFF"']
      - script.execute: publish_state

  - platform: gpio
    id: zone_3
    name: "Zone 3"
    pin:
      number: GPIO34
      mode:
        input: true
      inverted: false
    use_interrupt: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          format: "Zone 3 (GPIO34) -> %s"
          args: ['x ? "ON" : "OFF"']
      - script.execute: publish_state

  - platform: gpio
    id: zone_4
    name: "Zone 4"
    pin:
      number: GPIO35
      mode:
        input: true
      inverted: false
    use_interrupt: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          format: "Zone 4 (GPIO35) -> %s"
          args: ['x ? "ON" : "OFF"']
      - script.execute: publish_state

  # MON (what it monitors is not confirmed yet). GPIO32 has internal pulls, and
  # the breadboard has no MON channel, so the internal pull-down keeps the pin
  # from floating. On the real board the circuit drives the pin and the weak
  # internal pull-down is harmless.
  - platform: gpio
    id: mon_input
    name: "Monitor"
    pin:
      number: GPIO32
      mode:
        input: true
        pulldown: true
      inverted: false
    use_interrupt: false
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          format: "Monitor (GPIO32) -> %s"
          args: ['x ? "ON" : "OFF"']
      - script.execute: publish_state

  # KEY1 push button: pressed = HIGH. The PCB has a 10k pull-down; the internal
  # pull-down covers the breadboard, which has no KEY1 wired.
  - platform: gpio
    id: key1
    name: "Button"
    pin:
      number: GPIO27
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          format: "Button KEY1 (GPIO27) -> %s"
          args: ['x ? "ON" : "OFF"']

output:
  # -------------------------------------------------------------------------
  # RGB status LED (common cathode, HIGH = on). Not fitted on the breadboard;
  # configured now so the PCB works without changes.
  # -------------------------------------------------------------------------
  - platform: ledc
    id: led_red
    pin: GPIO19
  - platform: ledc
    id: led_green
    pin: GPIO18
  - platform: ledc
    id: led_blue
    pin: GPIO23

  # -------------------------------------------------------------------------
  # Relay outputs on the "IN" connector -> 2-channel relay module IN1/IN2
  # (set the module's jumper to HIGH-level trigger). Carried over from Jake's
  # original config: IN1 = common FIRE (any zone), IN2 = MON.
  # The PCB's 10k pull-downs keep both relays off while the ESP32 boots.
  # -------------------------------------------------------------------------
  - platform: gpio
    id: relay_fire
    pin: GPIO17
  - platform: gpio
    id: relay_mon
    pin: GPIO16

globals:
  # Toggled every tick to make the blue LED blink.
  - id: blink_on
    type: bool
    initial_value: "false"
  # Contract "seq": +1 per published snapshot, restarts at 0 on reboot.
  - id: publish_seq
    type: uint32_t
    initial_value: "0"

# ---------------------------------------------------------------------------
# Publish one full state snapshot (docs/mqtt-contract.md §4).
# Called on every input change, every 30 s (heartbeat), after every MQTT
# (re)connect and on the first clock sync.
# ---------------------------------------------------------------------------
script:
  - id: publish_state
    mode: queued
    then:
      - if:
          # Contract D1: never publish a placeholder. Every input must have a real
          # reading, the clock must be synced (ts), and MQTT must be connected.
          condition:
            lambda: |-
              return id(sntp_time).now().is_valid()
                  && id(zone_1).has_state() && id(zone_2).has_state()
                  && id(zone_3).has_state() && id(zone_4).has_state()
                  && id(mon_input).has_state()
                  && id(mqtt_client).is_connected();
          then:
            - lambda: id(publish_seq) += 1;
            - mqtt.publish_json:
                topic: fdas/fdas-iot-ane1-input-01/state
                qos: 1
                retain: true
                payload: |-
                  root["v"] = 1;
                  root["device"] = "fdas-iot-ane1-input-01";
                  root["ts"] = (int64_t) id(sntp_time).now().timestamp;
                  root["seq"] = id(publish_seq);
                  // 64-bit microsecond timer: no 49-day wrap like millis().
                  root["uptime_s"] = (int64_t) (esp_timer_get_time() / 1000000);
                  root["rssi"] = wifi::global_wifi_component->wifi_rssi();
                  // Raw contact state; wording like ALARM/ACTIVE belongs to the app.
                  JsonObject inputs = root["inputs"].to<JsonObject>();
                  inputs["z1"] = id(zone_1).state;
                  inputs["z2"] = id(zone_2).state;
                  inputs["z3"] = id(zone_3).state;
                  inputs["z4"] = id(zone_4).state;
                  inputs["mon"] = id(mon_input).state;
            - logger.log:
                format: "Published state seq=%u"
                args: ["id(publish_seq)"]

# ---------------------------------------------------------------------------
# Output logic, re-evaluated twice a second.
#
# This is LEVEL-triggered on purpose: every tick sets each output from the
# CURRENT input states, like a reconciliation loop. An edge-triggered version
# (on_state) doesn't fire for the first reading after boot, so a reboot during
# an active alarm would leave the FIRE relay off until some zone changed again.
# Here, the outputs are correct within 0.5s of boot, whatever happened before.
#
# RGB LED priority (an active input always wins, so a Wi-Fi problem can never
# hide an alarm on the local LED):
#   any zone or MON active -> solid red
#   Wi-Fi not connected    -> blinking blue (1 Hz)
#   otherwise              -> solid green
# ---------------------------------------------------------------------------
interval:
  - interval: 500ms
    then:
      - lambda: id(blink_on) = !id(blink_on);

      # FIRE relay: on while any zone (not MON) is active.
      - if:
          condition:
            or:
              - binary_sensor.is_on: zone_1
              - binary_sensor.is_on: zone_2
              - binary_sensor.is_on: zone_3
              - binary_sensor.is_on: zone_4
          then:
            - output.turn_on: relay_fire
          else:
            - output.turn_off: relay_fire

      # MON relay: follows the MON input.
      - if:
          condition:
            binary_sensor.is_on: mon_input
          then:
            - output.turn_on: relay_mon
          else:
            - output.turn_off: relay_mon

      # RGB status LED.
      - if:
          condition:
            or:
              - binary_sensor.is_on: zone_1
              - binary_sensor.is_on: zone_2
              - binary_sensor.is_on: zone_3
              - binary_sensor.is_on: zone_4
              - binary_sensor.is_on: mon_input
          then:
            - output.turn_on: led_red
            - output.turn_off: led_green
            - output.turn_off: led_blue
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - output.turn_off: led_red
                  - output.turn_on: led_green
                  - output.turn_off: led_blue
                else:
                  - output.turn_off: led_red
                  - output.turn_off: led_green
                  - if:
                      condition:
                        lambda: return id(blink_on);
                      then:
                        - output.turn_on: led_blue
                      else:
                        - output.turn_off: led_blue

  # Contract D2 heartbeat: a full snapshot every 30 s even when nothing changes.
  # Consumers treat 90 s without a fresh ts (3 missed heartbeats) as OFFLINE.
  - interval: 30s
    then:
      - script.execute: publish_state
