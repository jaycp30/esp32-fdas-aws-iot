# AWS Amplify Hosting build spec — esp32-fdas-aws-iot (monorepo)
#
# This repo is a monorepo: the React/Vite web app lives in `web/`, and ESP32
# firmware (ESPHome YAML) lives elsewhere in the repo (e.g. an `esphome/`
# folder). Amplify only builds and hosts the `web/` app. The `appRoot: web`
# key below tells Amplify to treat `web/` as the working directory for every
# command and artifact path in this file — it does not touch anything else
# in the repo.
#
# IMPORTANT: when connecting this repo for the first time in the Amplify
# console, you must also check "My app is a monorepo" and enter `web` as the
# app root on the "Add repository branch" page. That is what makes the
# console set the AMPLIFY_MONOREPO_APP_ROOT environment variable to `web` —
# it must match the `appRoot` value below or the build fails with a
# monorepo-root mismatch error. See docs/amplify-hosting.md for the exact
# console steps.
#
# CURRENT STATE: Gen 2 backend + frontend. `web/amplify/` defines a guest
# (unauthenticated) Cognito identity and a least-privilege AWS IoT policy -
# see web/amplify/backend.ts and docs/mqtt-contract.md. The `backend:`
# phase below runs BEFORE `frontend:`, because `pipeline-deploy` generates
# `web/amplify_outputs.json`, which the frontend build then reads (for
# Amplify.configure(), and for the custom `iot.endpoint`/`iot.region`
# outputs `src/data/liveDeviceSource.ts` needs). `web/amplify_outputs.json`
# stays gitignored - it's produced fresh on every build.
#
# Adding this backend phase also means the Amplify app needs an IAM service
# role: `pipeline-deploy` needs permission to create/update the Cognito
# user/identity pools and IAM roles this backend defines. Attach one in the
# console (App settings → General settings → App details → Edit → Service
# role) before the first deploy with this file - see docs/amplify-hosting.md.

version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            # Same Node as local dev and the frontend phase: this phase runs FIRST and
            # installs node_modules for both, so it must not use the image's default Node.
            - nvm use 22
            # `npm install`, not `npm ci`, on purpose. @aws-amplify/backend pulls in
            # data-construct / graphql-api-construct, which ship BUNDLED copies of older
            # sub-packages (@aws-cdk/toolkit-lib, @opentelemetry/*). `npm ci`'s strict
            # lockfile check can't validate bundled dependencies and fails with
            # "Missing: ... from lock file" even on a freshly generated lockfile
            # (reproduced 2026-09-27 with the latest Amplify packages). `npm install`
            # still installs the versions pinned in package-lock.json.
            - npm install --cache .npm --prefer-offline --no-audit --no-fund
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            # Pin the Node version the Amplify build container uses, so a
            # future change to Amplify's default image can't silently change
            # our build. Keep this in sync with local dev (Node 22.x).
            - nvm use 22
            # No install here: the backend phase above already ran it in
            # this same build environment (Gen 2 monorepo builds share one
            # container/workspace across phases), so re-installing here
            # would just be redundant work.
        build:
          commands:
            - npm run build
      artifacts:
        # Vite's default build output directory (relative to appRoot, i.e.
        # this resolves to web/dist).
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        # Cache npm's download cache and node_modules between builds so
        # `npm ci` doesn't re-download every package from the registry on
        # every single build.
        paths:
          - .npm/**/*
          - node_modules/**/*
